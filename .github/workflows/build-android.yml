name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install root dependencies
        run: npm install

      - name: Build all workspace packages
        run: npm run build

      - name: Install scratch-gui dependencies
        working-directory: packages/scratch-gui
        run: npm install

      - name: Install Capacitor dependencies
        working-directory: packages/scratch-gui
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build scratch-gui production files
        working-directory: packages/scratch-gui
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: packages/scratch-gui
        run: npx cap sync android || true

      - name: Grant execute permission for gradlew
        working-directory: packages/scratch-gui/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: packages/scratch-gui/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scratch-android-apk
          path: packages/scratch-gui/android/app/build/outputs/apk/debug/app-debug.apk
